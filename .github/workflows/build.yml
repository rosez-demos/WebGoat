name: "Main / Pull requests build"
on:
    pull_request:
        paths-ignore:
            - '.txt'
            - 'LICENSE'
            - 'docs/**'
        branches: [ main ]
    push:
        branches:
            - main

env:
    JF_URL: ${{ vars.JF_URL }}
    JF_SERVER_ID: rosesworld
    JF_REPO_RELEASE: onboarding-webgoat-libs-release
    JF_REPO_SNAPSHOT: onboarding-webgoat-libs-snapshot

jobs:
    pre-commit:
        name: Pre-commit check
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout git repository
                uses: actions/checkout@v7
            -   name: Setup python
                uses: actions/setup-python@v7
                with:
                    python-version: "3.9"
            -   name: Setup Java
                uses: ./.github/actions/java-setup
                with:
                    cache: ""
            -   name: Pre-commit checks
                uses: pre-commit/action@v3.0.1
            -   name: pre-commit-c-lite
                uses: pre-commit-ci/lite-action@v1.1.0
                if: always()
    build:
        runs-on: ubuntu-latest
        needs: [ pre-commit ]
        permissions:
            id-token: write
            contents: read
        steps:
            -   uses: actions/checkout@v7
            -   name: Set up JDK
                uses: ./.github/actions/java-setup
                with:
                    cache: 'maven'
            -   name: Set up JFrog CLI
                uses: jfrog/setup-jfrog-cli@v4
                with:
                    oidc-provider-name: rosez-demos/WebGoat@github
            -   name: Configure Maven resolution repo
                run: |
                    jf mvn-config \
                      --server-id-resolve=${{ env.JF_SERVER_ID }} \
                      --repo-resolve-releases=${{ env.JF_REPO_RELEASE }} --repo-resolve-snapshots=${{ env.JF_REPO_SNAPSHOT }}
            -   name: Build with Maven
                run: jf mvn --no-transfer-progress verify
    jfrog-publish:
        name: Publish to JFrog
        runs-on: ubuntu-latest
        needs: [ build ]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        permissions:
            id-token: write
            contents: read
        env:
            JFROG_CLI_BUILD_NAME: webgoat
            JFROG_CLI_BUILD_NUMBER: ${{ github.run_number }}
            JFROG_CLI_BUILD_PROJECT: onboarding
        steps:
            -   uses: actions/checkout@v7
            -   name: Set up JDK
                uses: ./.github/actions/java-setup
                with:
                    cache: 'maven'
            -   name: Set up JFrog CLI
                uses: jfrog/setup-jfrog-cli@v4
                with:
                    oidc-provider-name: rosez-demos/WebGoat@github
            -   name: Configure Maven resolution/deployment repos
                run: |
                    jf mvn-config \
                      --server-id-resolve=${{ env.JF_SERVER_ID }} --server-id-deploy=${{ env.JF_SERVER_ID }} \
                      --repo-resolve-releases=${{ env.JF_REPO_RELEASE }} --repo-resolve-snapshots=${{ env.JF_REPO_SNAPSHOT }} \
                      --repo-deploy-releases=${{ env.JF_REPO_RELEASE }} --repo-deploy-snapshots=${{ env.JF_REPO_SNAPSHOT }}
            -   name: Build, test and deploy artifacts
                run: jf mvn --no-transfer-progress clean deploy --build-name=${{ env.JFROG_CLI_BUILD_NAME }} --build-number=${{ env.JFROG_CLI_BUILD_NUMBER }}
            -   name: Publish build-info
                run: |
                    jf rt build-publish \
                      --project=${{ env.JFROG_CLI_BUILD_PROJECT }} \
                      --collect-env --collect-git-info \
                      ${{ env.JFROG_CLI_BUILD_NAME }} ${{ env.JFROG_CLI_BUILD_NUMBER }}
            -   name: Xray scan
                run: jf build-scan --project=${{ env.JFROG_CLI_BUILD_PROJECT }} ${{ env.JFROG_CLI_BUILD_NAME }} ${{ env.JFROG_CLI_BUILD_NUMBER }}
