name: "Main / Pull requests build"
on:
    pull_request:
        paths-ignore:
            - '.txt'
            - 'LICENSE'
            - 'docs/**'
        branches: [ main ]
    push:
        branches:
            - main

jobs:
    pre-commit:
        name: Pre-commit check
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout git repository
                uses: actions/checkout@v7
            -   name: Setup python
                uses: actions/setup-python@v7
                with:
                    python-version: "3.9"
            -   name: Setup Java
                uses: ./.github/actions/java-setup
                with:
                    cache: ""
            -   name: Pre-commit checks
                uses: pre-commit/action@v3.0.1
            -   name: pre-commit-c-lite
                uses: pre-commit-ci/lite-action@v1.1.0
                if: always()
    build:
        runs-on: ${{ matrix.os }}
        needs: [ pre-commit ]
        strategy:
            fail-fast: true
            matrix:
                os: [ windows-latest, ubuntu-latest, macos-15-intel ]
            max-parallel: 1
        permissions:
            id-token: write
            contents: read
        env:
            JF_URL: ${{ vars.JF_URL }}
        steps:
            -   uses: actions/checkout@v7
            -   name: Set up JDK
                uses: ./.github/actions/java-setup
                with:
                    cache: 'maven'
            -   name: Set up JFrog CLI
                uses: jfrog/setup-jfrog-cli@v4
                with:
                    oidc-provider-name: rosez-demos/WebGoat@github
            -   name: Configure Maven resolution repo
                run: |
                    jf mvn-config \
                      --server-id-resolve=rosesworld \
                      --repo-resolve-releases=onboarding-webgoat-libs-release --repo-resolve-snapshots=onboarding-webgoat-libs-snapshot
            -   name: Build with Maven
                run: jf mvn --no-transfer-progress verify
    jfrog-publish:
        name: Publish to JFrog
        runs-on: ubuntu-latest
        needs: [ build ]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        permissions:
            id-token: write
            contents: read
        env:
            JF_URL: ${{ vars.JF_URL }}
            JFROG_CLI_BUILD_NAME: webgoat
            JFROG_CLI_BUILD_NUMBER: ${{ github.run_number }}
            JFROG_CLI_BUILD_PROJECT: onboarding
        steps:
            -   uses: actions/checkout@v7
            -   name: Set up JDK
                uses: ./.github/actions/java-setup
                with:
                    cache: 'maven'
            -   name: Set up JFrog CLI
                uses: jfrog/setup-jfrog-cli@v4
                with:
                    oidc-provider-name: rosez-demos/WebGoat@github
            -   name: Configure Maven resolution/deployment repos
                run: |
                    jf mvn-config \
                      --server-id-resolve=rosesworld --server-id-deploy=rosesworld \
                      --repo-resolve-releases=onboarding-webgoat-libs-release --repo-resolve-snapshots=onboarding-webgoat-libs-snapshot \
                      --repo-deploy-releases=onboarding-webgoat-libs-release --repo-deploy-snapshots=onboarding-webgoat-libs-snapshot
            -   name: Build, test and deploy artifacts
                run: jf mvn --no-transfer-progress clean deploy --build-name=${{ env.JFROG_CLI_BUILD_NAME }} --build-number=${{ env.JFROG_CLI_BUILD_NUMBER }}
            -   name: Publish build-info
                run: |
                    jf rt build-publish \
                      --project=${{ env.JFROG_CLI_BUILD_PROJECT }} \
                      --collect-env --collect-git-info \
                      ${{ env.JFROG_CLI_BUILD_NAME }} ${{ env.JFROG_CLI_BUILD_NUMBER }}
            -   name: Xray scan
                run: jf build-scan --project=${{ env.JFROG_CLI_BUILD_PROJECT }} ${{ env.JFROG_CLI_BUILD_NAME }} ${{ env.JFROG_CLI_BUILD_NUMBER }}
